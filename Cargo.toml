[package]
name = "niruio"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "NIRU in out: sound outputs, inputs, apps, cameras and a sound doctor in the terminal"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
