name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: sh tests/smoke.sh target/release/niruio
      - name: Static release build (as the release workflow makes it)
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --release --locked --target x86_64-unknown-linux-musl
          sh tests/smoke.sh target/x86_64-unknown-linux-musl/release/niruio
      - name: PipeWire sandbox (null sinks only, the runner's WirePlumber)
        run: |
          sudo apt-get install -y --no-install-recommends pipewire pipewire-bin wireplumber
          sh tests/sandbox.sh target/release/niruio
      - name: PipeWire sandbox on Debian 12 (WirePlumber 0.4)
        run: |
          docker run --rm -v "$PWD":/src:ro debian:bookworm-slim sh -c '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends pipewire pipewire-bin wireplumber procps dbus-daemon >/dev/null &&
            wireplumber --version | tail -1 &&
            cd /src && sh tests/sandbox.sh target/x86_64-unknown-linux-musl/release/niruio'
  msrv:
    name: MSRV (Rust 1.85, Debian 13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: sh tests/smoke.sh target/release/niruio
